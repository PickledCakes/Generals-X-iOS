name: iOS content tooling
on: [push, pull_request]
permissions:
  contents: read
jobs:
  content-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/build/ios/tests -v
      - run: python3 -m py_compile scripts/build/ios/content.py scripts/build/ios/icons.py scripts/build/ios/build_collection.py
